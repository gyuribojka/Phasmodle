<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phasmodle - Emoji</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Creepster&family=Roboto+Mono:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
</head>
<body>
    <div class="overlay"></div>
    <div class="container">
        <header>
            <h1 class="flicker">PHASMODLE</h1>
            <nav class="mode-nav">
                <a href="index.html">CLASSIC</a>
                <a href="riddle.html">RIDDLE</a>
                <a href="emoji.html" class="active">EMOJI</a>
                <a href="map.html">MAP</a>
            </nav>
            <p>Decode the emoji clues and identify the ghost.</p>
        </header>

        <main>
            <section class="emoji-clue-wrap">
                <h2>Emoji Clues</h2>
                <div id="emoji-clues" class="emoji-clues" aria-live="polite"></div>
                <p id="emoji-progress" class="subtle-note"></p>
            </section>

            <div class="input-section">
                <input type="text" id="ghost-input" placeholder="Type a ghost name..." autocomplete="off">
                <ul id="suggestions" class="hidden"></ul>
                <button id="guess-btn">GUESS</button>
                <div id="error-message"></div>
            </div>

            <div class="message-container">
                <p id="game-message"></p>
            </div>

            <section class="guessed-list-container">
                <div id="guessed-list"></div>
            </section>
        </main>

        <div class="play-again-container">
            <button id="play-again-btn" class="hidden">PLAY AGAIN</button>
        </div>
    </div>

    <script src="emoji.js"></script>
</body>
</html>
