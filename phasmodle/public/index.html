<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phasmodle - Classic</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Creepster&family=Roboto+Mono:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
</head>
<body>
    <div class="overlay"></div>
    <div class="container">
        <header>
            <h1 class="flicker">PHASMODLE</h1>
            <nav class="mode-nav">
                <a href="index.html" class="active">CLASSIC</a>
                <a href="riddle.html">RIDDLE</a>
            </nav>
            <p>Identify the ghost. Enter a ghost name below.</p>
        </header>

        <main>
            <div class="input-section">
                <input type="text" id="ghost-input" placeholder="Type a ghost name..." autocomplete="off">
                <ul id="suggestions" class="hidden"></ul>
                <button id="guess-btn">GUESS</button>
                <div id="error-message"></div>
            </div>

            <div class="message-container">
                <p id="game-message"></p>
                <div id="hint-message" class="hidden"></div>
            </div>

            <div class="guesses-container">
                <div class="guess-header">
                    <div>Ghost</div>
                    <div>Evidence 1</div>
                    <div>Evidence 2</div>
                    <div>Evidence 3</div>
                    <div>Hunt Sanity</div>
                    <div>Speed</div>
                </div>
                <div id="guesses-grid">
                </div>
            </div>
        </main>
        
        <div class="play-again-container">
            <button id="play-again-btn" class="hidden">PLAY AGAIN</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
