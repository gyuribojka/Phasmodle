<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phasmodle - Map Guess</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Creepster&family=Roboto+Mono:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
</head>
<body>
    <div class="overlay"></div>
    <div class="container">
        <header>
            <h1 class="flicker">PHASMODLE</h1>
            <nav class="mode-nav">
                <a href="index.html">CLASSIC</a>
                <a href="riddle.html">RIDDLE</a>
                <a href="emoji.html">EMOJI</a>
                <a href="map.html" class="active">MAP</a>
            </nav>
            <p>Guess the map/place from a progressively revealed image.</p>
        </header>

        <main>
            <section class="map-stage">
                <canvas id="map-canvas" width="640" height="360" aria-label="Pixelated map clue"></canvas>
                <div class="map-meta">
                    <p id="reveal-status" class="subtle-note"></p>
                </div>
            </section>

            <section class="zoom-section">
                <h2>Zoom Reveal</h2>
                <canvas id="zoom-canvas" width="320" height="180" aria-label="Zoomed reveal clue"></canvas>
            </section>

            <div class="input-section">
                <input type="text" id="place-input" placeholder="Type a map/place name..." autocomplete="off">
                <ul id="suggestions" class="hidden"></ul>
                <button id="guess-btn">GUESS</button>
                <div id="error-message"></div>
            </div>

            <div class="message-container">
                <p id="game-message"></p>
                <div id="map-hint" class="hidden"></div>
            </div>

            <section class="guessed-list-container">
                <div id="guessed-list"></div>
            </section>
        </main>

        <div class="play-again-container">
            <button id="play-again-btn" class="hidden">PLAY AGAIN</button>
        </div>
    </div>

    <script src="map.js"></script>
</body>
</html>
